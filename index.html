<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeBet | Ultimate Premium Arena</title>
    <style>
        :root {
            --bg-body: #0b0e14;
            --bg-sidebar: #111622;
            --bg-card: #171f30;
            --bg-card-hover: #1f2a42;
            --primary: #9d4edd;
            --primary-glow: rgba(157, 78, 221, 0.5);
            --neon-green: #00ff88;
            --neon-green-glow: rgba(0, 255, 136, 0.4);
            --neon-red: #ff3366;
            --neon-red-glow: rgba(255, 51, 102, 0.5);
            --gold: #ffb703;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --text-gold: #ffd166;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        .flash-red { animation: screenFlashRed 0.4s ease-out; }
        .shake-screen { animation: screenShake 0.4s ease-in-out; }

        /* SIDEBAR */
        aside { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .brand { padding: 25px; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(45deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .menu-section { padding: 0 15px; margin-bottom: 25px; }
        .menu-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); padding-left: 10px; margin-bottom: 10px; }
        .menu-item { display: flex; align-items: center; padding: 12px 15px; color: var(--text-main); text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 5px; transition: 0.2s; }
        .menu-item:hover { background-color: rgba(255, 255, 255, 0.03); color: var(--primary); }

        /* MAIN */
        main { margin-left: 260px; flex-grow: 1; display: flex; flex-direction: column; transition: all 0.3s; }
        header { height: 75px; background-color: rgba(11, 14, 20, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: flex-end; align-items: center; padding: 0 40px; position: sticky; top: 0; z-index: 9; border-bottom: 1px solid rgba(255, 255, 255, 0.02); }
        
        .wallet-zone { display: flex; align-items: center; background-color: var(--bg-sidebar); border-radius: 8px; padding: 6px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .balance { padding: 0 15px; font-weight: 700; color: var(--text-gold); font-size: 1.1rem; }
        .btn-deposit { background: linear-gradient(135deg, var(--primary), #7b2cbf); color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px var(--primary-glow); transition: 0.2s; }
        .btn-deposit:hover { transform: scale(1.05); }

        /* TICKER */
        .live-ticker { background-color: #080a0f; height: 45px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); display: flex; align-items: center; gap: 15px; padding: 0 40px; overflow: hidden; }
        .ticker-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--neon-green); white-space: nowrap; }
        .ticker-container { display: flex; gap: 12px; width: 100%; }
        .win-box { background-color: var(--bg-card); padding: 4px 12px; border-radius: 4px; font-size: 12px; display: flex; gap: 8px; border-bottom: 2px solid var(--neon-green); animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* LOBBY */
        .content-body { padding: 40px; max-width: 1300px; width: 100%; margin: 0 auto; }
        .hero-banner { background: linear-gradient(135deg, rgba(23, 31, 48, 0.8) 0%, rgba(17, 22, 34, 0.4) 100%), radial-gradient(circle at top right, var(--primary-glow), transparent 60%); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .hero-text h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
        .hero-text h1 span { color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
        .hero-text p { color: var(--text-muted); }

        /* GAMES GRID */
        .section-header h2 { font-size: 20px; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 12px; margin-bottom: 25px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .game-card { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid transparent; }
        .game-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 25px var(--primary-glow); }
        .game-thumbnail { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 55px; transition: transform 0.3s; }
        .game-card:hover .game-thumbnail { transform: scale(1.15) rotate(3deg); }
        .thumb-crash { background: linear-gradient(135deg, #2c1a4d, #110924); }
        .thumb-mines { background: linear-gradient(135deg, #163e30, #091a14); }
        .thumb-cases { background: linear-gradient(135deg, #4d3a1a, #241909); }
        .thumb-darts { background: linear-gradient(135deg, #1a4d4d, #092424); }
        .thumb-roulette { background: linear-gradient(135deg, #4d1a1a, #240909); }
        .game-info { padding: 15px; background: rgba(0,0,0,0.3); font-weight: 600; text-align: center; }

        /* ARENA INTERFACE */
        #game-arena { display: none; background-color: var(--bg-sidebar); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 30px; margin-top: 20px; animation: popIn 0.4s ease-out; }
        .arena-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .btn-leave { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-leave:hover { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red-glow); }
        
        .game-layout { display: grid; grid-template-columns: 320px 1fr; gap: 30px; min-height: 480px; }
        .bet-panel { background-color: var(--bg-card); padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        .input-group label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .input-group input, .input-group select { width: 100%; background: var(--bg-body); border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px; border-radius: 8px; color: #fff; font-weight: 600; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        .btn-play-action { background: var(--neon-green); color: #000; border: none; padding: 18px; font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 15px; letter-spacing: 0.5px; transition: all 0.2s; box-shadow: 0 4px 15px var(--neon-green-glow); }
        .btn-play-action:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-play-action:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

        .game-display { background: var(--bg-body); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 30px; border: 1px solid rgba(255,255,255,0.02); box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }

        /* MINES GFX */
        .mines-grid-5x5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; max-width: 440px; aspect-ratio: 1/1; }
        .mine-cell-5x5 { background: #212c42; border: none; border-radius: 10px; cursor: pointer; font-size: 26px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 5px 0 #131b29; position: relative; }
        .mine-cell-5x5:hover:not(:disabled) { background: #2b3a57; transform: translateY(-3px); box-shadow: 0 8px 0 #131b29; }
        .mine-cell-5x5.clicked { animation: flipTile 0.25s ease-out forwards; }
        .mine-cell-5x5.diamond-found { background: linear-gradient(135deg, #00f5d4, #00b4d8) !important; box-shadow: 0 0 20px rgba(0, 245, 212, 0.6) !important; transform: scale(0.95); cursor: default; }
        .mine-cell-5x5.bomb-exploded { background: linear-gradient(135deg, #ff3366, #d90429) !important; box-shadow: 0 0 25px var(--neon-red-glow) !important; transform: scale(0.95); animation: tileExplode 0.3s ease-out; cursor: default; }
        .mine-cell-5x5.revealed-safe { background: #171f30; opacity: 0.3; cursor: default; box-shadow: none; transform: scale(0.9); }

        /* CRASH GFX */
        .crash-container { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; min-height: 350px; justify-content: flex-end; }
        .crash-plot-zone { flex-grow: 1; width: 100%; position: relative; border-left: 2px solid rgba(255,255,255,0.1); border-bottom: 2px solid rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 10px; }
        #crash-multiplier { font-size: 4.5rem; font-weight: 800; color: #fff; position: absolute; top: 20px; left: 30px; z-index: 2; }
        .rocket-ship { font-size: 50px; position: absolute; bottom: 0; left: 0; transform: translate(-50%, 50%); transition: all 0.1s linear; z-index: 3; }
        .rocket-trail { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(to right, transparent, var(--primary), var(--neon-green)); transform-origin: left bottom; width: 0; }

        /* INTERACTIVE BOXES */
        .box-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; width: 100%; }
        .interactive-box-wrapper { position: relative; cursor: pointer; animation: floatBox 2s ease-in-out infinite; padding: 20px; transition: transform 0.2s; }
        .interactive-box-wrapper:hover { transform: scale(1.1); filter: drop-shadow(0 0 25px var(--primary-glow)); }
        .box-big-icon { font-size: 110px; user-select: none; }
        .box-hint-text { font-size: 14px; color: var(--text-gold); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; animation: pulseGlow 1.5s infinite; text-align: center; }
        .box-shake-heavy { animation: boxRumbleHeavy 0.1s infinite !important; }
        .box-explode-out { animation: boxPopOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .reward-card { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 2px solid var(--gold); border-radius: 16px; padding: 30px 50px; text-align: center; box-shadow: 0 0 40px rgba(255, 183, 3, 0.4); animation: rewardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* INTERACTIVE DARTS GFX */
        .dart-arena { display: flex; flex-direction: column; align-items: center; gap: 25px; width: 100%; }
        .dart-board { width: 260px; height: 260px; border-radius: 50%; background: #0c1017; border: 8px solid #222d3d; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .dart-ring-outer { width: 190px; height: 190px; border-radius: 50%; background: #3a0ca3; display: flex; align-items: center; justify-content: center; border: 2px dashed rgba(255,255,255,0.2); }
        .dart-ring-mid { width: 120px; height: 120px; border-radius: 50%; background: #f72585; display: flex; align-items: center; justify-content: center; }
        .dart-bullseye { width: 44px; height: 44px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 20px var(--gold); }
        .dart-pin-visual { position: absolute; font-size: 35px; z-index: 8; transform: translate(-50%, -50%); animation: rewardPop 0.2s ease-out; pointer-events: none; }
        
        .power-meter-container { width: 100%; max-width: 320px; background: #1e293b; height: 26px; border-radius: 13px; border: 2px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; margin-top: 10px; }
        .power-meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-green) 0%, var(--gold) 65%, var(--neon-red) 90%); }
        .power-meter-target-line { position: absolute; left: 75%; top: 0; width: 6px; height: 100%; background: #fff; box-shadow: 0 0 10px #fff; z-index: 3; }

        /* REAL CIRCULAR ROULETTE WHEEL GFX */
        .roulette-arena { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .roulette-wheel-container { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .roulette-pointer { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 24px solid var(--gold); z-index: 5; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
        
        .roulette-wheel-disc { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #1e2533; position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.7); will-change: transform; }
        /* Style des tranches via Conic-Gradient alterné parfait sur 12 segments (30deg chacun) */
        .wheel-colors-layer { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(
            #ef233c 0deg 30deg, #111324 30deg 60deg,
            #ef233c 60deg 90deg, #111324 90deg 120deg,
            #ef233c 120deg 150deg, #111324 150deg 180deg,
            #ffb703 180deg 210deg, #111324 210deg 240deg,
            #ef233c 240deg 270deg, #111324 270deg 300deg,
            #ef233c 300deg 330deg, #111324 330deg 360deg
        ); }
        .wheel-center-cap { position: absolute; width: 50px; height: 50px; background: #0b0e14; border: 4px solid var(--gold); border-radius: 50%; z-index: 4; box-shadow: inset 0 0 10px #000; }
        .roulette-chips-selectors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .chip-btn { padding: 14px; border: none; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: 0.2s; border-bottom: 3px solid rgba(0,0,0,0.3); }
        .chip-btn.r-red { background: linear-gradient(135deg, #ef233c, #b7094c); }
        .chip-btn.r-black { background: linear-gradient(135deg, #2b2d42, #111324); }
        .chip-btn.r-gold { background: linear-gradient(135deg, #ffb703, #fb8500); }
        .chip-btn.active-chip { outline: 3px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: translateY(-2px); }

        /* KEYFRAMES */
        @keyframes floatBox { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; text-shadow: 0 0 10px var(--text-gold); } }
        @keyframes boxRumbleHeavy { 0%, 100% { transform: translate(3px, 2px) rotate(0deg); } 50% { transform: translate(-2px, -3px) rotate(-2deg); } }
        @keyframes flipTile { 0% { transform: scale(1) rotateY(0); } 100% { transform: scale(0.95) rotateY(180deg); } }
        @keyframes tileExplode { 0% { transform: scale(1); filter: brightness(2); } 100% { transform: scale(0.95); filter: brightness(1); } }
        @keyframes boxPopOpen { 0% { transform: scale(1.1); } 100% { transform: scale(0); opacity: 0; } }
        @keyframes rewardPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes screenFlashRed { 0% { background-color: rgba(255, 51, 102, 0.35); } 100% { background-color: transparent; } }
        @keyframes screenShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <aside>
        <div class="brand" onclick="backToLobby()">Luxe<span>Bet</span></div>
        <div class="menu-section">
            <div class="menu-label">Navigation</div>
            <a href="#" class="menu-item" onclick="backToLobby()">🏠 Accueil</a>
        </div>
    </aside>

    <main id="main-content-wrapper">
        <div class="live-ticker">
            <div class="ticker-label">Gains Live</div>
            <div class="ticker-container" id="live-wins-container"></div>
        </div>

        <header>
            <div class="wallet-zone">
                <div class="balance">🪙 <span id="user-balance">1000.00</span> $</div>
                <button class="btn-deposit" onclick="resetBalance()">Reset</button>
            </div>
        </header>

        <div class="content-body">
            
            <div id="lobby-view">
                <section class="hero-banner">
                    <div class="hero-text">
                        <h1>Luxe<span>Bet</span> Premium Arena</h1>
                        <p>Découvrez nos modes exclusifs entièrement repensés avec un maximum de sensations visuelles.</p>
                    </div>
                    <div style="font-size: 70px;">💎</div>
                </section>

                <section>
                    <div class="section-header"><h2>Jeux Originaux Simulés</h2></div>
                    <div class="games-grid">
                        <div class="game-card" onclick="startGame('mines')">
                            <div class="game-thumbnail thumb-mines">💣</div>
                            <div class="game-info">Mines Royal</div>
                        </div>
                        <div class="game-card" onclick="startGame('crash')">
                            <div class="game-thumbnail thumb-crash">🚀</div>
                            <div class="game-info">Crash Multiplier</div>
                        </div>
                        <div class="game-card" onclick="startGame('cases')">
                            <div class="game-thumbnail thumb-cases">📦</div>
                            <div class="game-info">Boîtes Mystères 2.0</div>
                        </div>
                        <div class="game-card" onclick="startGame('darts')">
                            <div class="game-thumbnail thumb-darts">🎯</div>
                            <div class="game-info">Fléchettes Force</div>
                        </div>
                        <div class="game-card" onclick="startGame('roulette')">
                            <div class="game-thumbnail thumb-roulette">🎡</div>
                            <div class="game-info">Roulette Orbit</div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="game-arena">
                <div class="arena-header">
                    <h3 id="arena-title">Jeu</h3>
                    <button class="btn-leave" onclick="backToLobby()">Retour à l'accueil</button>
                </div>
                
                <div class="game-layout">
                    <div class="bet-panel">
                        <div class="input-group">
                            <label>Mise ($)</label>
                            <input type="number" id="bet-amount" value="10" min="1">
                        </div>
                        <div id="custom-game-options"></div>
                        <button class="btn-play-action" id="main-action-btn" onclick="executeGameLogic()">Placer la mise</button>
                    </div>

                    <div class="game-display" id="game-display-zone"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let balance = 1000.00;
        let currentGame = '';
        let gameRunning = false;

        // States globales
        let minesBoard = [], isMinesActive = false, minesCount = 3, revealedDiamonds = 0, currentMinesBet = 0, currentMinesMultiplier = 1.00;
        let crashInterval, crashMultiplier = 1.00, crashPoint = 0;
        let selectedRouletteColor = 'red';
        let currentActiveBoxPrice = 0;

        // States Fléchettes
        let isDartCharging = false;
        let dartPowerValue = 0;
        let dartPowerDirection = 1;
        let dartAnimFrame;

        function updateBalanceView() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
        }
        function resetBalance() { balance = 1000.00; updateBalanceView(); }
        function backToLobby() {
            clearInterval(crashInterval);
            cancelAnimationFrame(dartAnimFrame);
            gameRunning = false; isMinesActive = false; isDartCharging = false;
            document.getElementById('game-arena').style.display = 'none';
            document.getElementById('lobby-view').style.display = 'block';
        }
        function triggerScreenEffects(type) {
            const wrapper = document.getElementById('main-content-wrapper');
            if(type === 'lose') {
                wrapper.classList.add('flash-red', 'shake-screen');
                setTimeout(() => wrapper.classList.remove('flash-red', 'shake-screen'), 400);
            }
        }

        function startGame(gameType) {
            currentGame = gameType;
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('game-arena').style.display = 'block';
            
            const title = document.getElementById('arena-title');
            const display = document.getElementById('game-display-zone');
            const opt = document.getElementById('custom-game-options');
            const actionBtn = document.getElementById('main-action-btn');
            
            opt.innerHTML = '';
            actionBtn.disabled = false;
            actionBtn.style.background = 'var(--neon-green)';
            actionBtn.innerText = "Placer la mise";

            if (gameType === 'mines') {
                title.innerText = "💣 Mines Royal";
                opt.innerHTML = `<div class="input-group"><label>Nombre de Bombes</label><input type="number" id="mine-bombs-count" value="3" min="1" max="24"></div>`;
                buildMinesGrid5x5(display);
            } else if (gameType === 'crash') {
                title.innerText = "🚀 Crash Arena";
                display.innerHTML = `<div class="crash-container"><div id="crash-multiplier">1.00x</div><div class="crash-plot-zone"><div class="rocket-trail" id="rocket-trail-line"></div><div class="rocket-ship" id="rocket-emoji">🚀</div></div></div>`;
            } else if (gameType === 'cases') {
                title.innerText = "📦 Boîtes Mystères Interactives";
                opt.innerHTML = `<div class="input-group"><label>Type de Box</label><select id="box-type"><option value="10">Caisse Recrue (10$)</option><option value="50">Caisse Élite (50$)</option><option value="250">Caisse Suprême (250$)</option></select></div>`;
                display.innerHTML = `<div class="box-stage"><p style="color:var(--text-muted);">Achetez une boîte pour commencer l'ouverture manuelle.</p></div>`;
            } else if (gameType === 'darts') {
                title.innerText = "🎯 Fléchettes Force Challenge";
                display.innerHTML = `
                    <div class="dart-arena">
                        <div class="dart-board" id="main-dart-board">
                            <div class="dart-ring-outer">
                                <div class="dart-ring-mid">
                                    <div class="dart-bullseye"></div>
                                </div>
                            </div>
                        </div>
                        <div class="power-meter-container">
                            <div class="power-meter-target-line"></div>
                            <div class="power-meter-fill" id="dart-power-fill"></div>
                        </div>
                    </div>`;
            } else if (gameType === 'roulette') {
                title.innerText = "🎡 Roulette Orbit Casino";
                opt.innerHTML = `
                    <div class="roulette-chips-selectors">
                        <button class="chip-btn r-red active-chip" id="chip-red" onclick="selectRouletteTarget('red')">Rouge (x2)</button>
                        <button class="chip-btn r-black" id="chip-black" onclick="selectRouletteTarget('black')">Noir (x2)</button>
                        <button class="chip-btn r-gold" id="chip-gold" onclick="selectRouletteTarget('gold')">Gold (x14)</button>
                    </div>`;
                buildRouletteWheel(display);
            }
        }

        function executeGameLogic() {
            let bet = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) {
                alert("Mise invalide ou capital insuffisant !"); return;
            }
            if (currentGame === 'mines') handleMinesMainAction(bet);
            else if (currentGame === 'crash') runCrash(bet);
            else if (currentGame === 'cases') buyMysteryBox(bet);
            else if (currentGame === 'darts') runDartsGame(bet);
            else if (currentGame === 'roulette') runRouletteWheel(bet);
        }

        /* 💣 MINES LOGIC */
        function buildMinesGrid5x5(display) {
            let gridHtml = '<div class="mines-grid-5x5">';
            for(let i=0; i<25; i++) gridHtml += `<button class="mine-cell-5x5" id="cell-5x5-${i}" onclick="clickMinesTile(${i})"></button>`;
            display.innerHTML = gridHtml + '</div>';
        }
        function handleMinesMainAction(bet) {
            const actionBtn = document.getElementById('main-action-btn');
            if (!isMinesActive) {
                let numBombs = parseInt(document.getElementById('mine-bombs-count').value);
                if (isNaN(numBombs) || numBombs < 1 || numBombs > 24) return;
                balance -= bet; updateBalanceView();
                isMinesActive = true; currentMinesBet = bet; minesCount = numBombs; revealedDiamonds = 0; currentMinesMultiplier = 1.00;
                minesBoard = Array(25).fill('💎');
                let bombsPlaced = 0;
                while (bombsPlaced < minesCount) {
                    let r = Math.floor(Math.random() * 25);
                    if (minesBoard[r] !== '💣') { minesBoard[r] = '💣'; bombsPlaced++; }
                }
                for(let i=0; i<25; i++) {
                    let t = document.getElementById(`cell-5x5-${i}`);
                    t.className = 'mine-cell-5x5'; t.innerHTML = ''; t.disabled = false;
                }
                actionBtn.innerText = "Encaisser (1.00x)"; actionBtn.style.background = 'var(--gold)';
            } else {
                let won = currentMinesBet * currentMinesMultiplier;
                balance += won; updateBalanceView(); isMinesActive = false;
                actionBtn.innerText = `Gagné +${won.toFixed(2)}$`; actionBtn.style.background = 'var(--neon-green)';
                revealEntireMinesBoard(true);
            }
        }
        function clickMinesTile(index) {
            if (!isMinesActive) return;
            let tile = document.getElementById(`cell-5x5-${index}`);
            if (tile.classList.contains('clicked')) return;
            tile.classList.add('clicked');
            setTimeout(() => {
                if (minesBoard[index] === '💣') {
                    tile.classList.add('bomb-exploded'); tile.innerHTML = '💥'; isMinesActive = false;
                    const actionBtn = document.getElementById('main-action-btn');
                    actionBtn.innerText = "💥 PERDU !"; actionBtn.style.background = 'var(--neon-red)';
                    triggerScreenEffects('lose'); revealEntireMinesBoard(false);
                } else {
                    tile.classList.add('diamond-found'); tile.innerHTML = '💎'; revealedDiamonds++;
                    let safe = 25 - minesCount;
                    currentMinesMultiplier *= ((25 - (revealedDiamonds - 1)) / (safe - (revealedDiamonds - 1)));
                    const actionBtn = document.getElementById('main-action-btn');
                    let gains = currentMinesBet * currentMinesMultiplier;
                    actionBtn.innerText = `Encaisser ${gains.toFixed(2)}$ (${currentMinesMultiplier.toFixed(2)}x)`;
                    if (revealedDiamonds === safe) {
                        balance += gains; updateBalanceView(); isMinesActive = false;
                        actionBtn.innerText = `🎉 MAX WIN : +${gains.toFixed(2)}$`; actionBtn.style.background = 'var(--neon-green)';
                        revealEntireMinesBoard(true);
                    }
                }
            }, 120);
        }
        function revealEntireMinesBoard(w) {
            for(let i=0; i<25; i++) {
                let t = document.getElementById(`cell-5x5-${i}`); t.disabled = true;
                if (!t.classList.contains('diamond-found') && !t.classList.contains('bomb-exploded')) {
                    if (minesBoard[i] === '💣') { t.innerHTML = '💣'; t.style.background = w ? 'rgba(255,255,255,0.05)' : 'rgba(255, 51, 102, 0.15)'; }
                    else { t.innerHTML = '💎'; t.classList.add('revealed-safe'); }
                }
            }
        }

        /* 🚀 CRASH LOGIC */
        function runCrash(bet) {
            const btn = document.getElementById('main-action-btn');
            const rkt = document.getElementById('rocket-emoji');
            const trl = document.getElementById('rocket-trail-line');
            const txt = document.getElementById('crash-multiplier');
            if (!gameRunning) {
                balance -= bet; updateBalanceView(); gameRunning = true; crashMultiplier = 1.00;
                crashPoint = Math.random() > 0.5 ? (Math.random() * 1.6 + 1.02) : (Math.random() * 4.2 + 1.1);
                btn.innerText = "CASH OUT (1.00x)"; btn.style.background = 'var(--gold)';
                crashInterval = setInterval(() => {
                    crashMultiplier += 0.03 * (1 + (crashMultiplier * 0.1));
                    txt.innerText = crashMultiplier.toFixed(2) + 'x';
                    btn.innerText = `CASH OUT (${crashMultiplier.toFixed(2)}x)`;
                    let p = Math.min((crashMultiplier - 1) * 16, 85);
                    rkt.style.left = p + '%'; rkt.style.bottom = p + '%';
                    trl.style.width = (p * 1.4) + '%'; trl.style.transform = `rotate(-45deg)`;
                    if (crashMultiplier >= crashPoint) {
                        clearInterval(crashInterval);
                        txt.innerText = '💥 CRASH @ ' + crashMultiplier.toFixed(2) + 'x';
                        rkt.innerHTML = '💥'; btn.innerText = "EXPLOSÉ !"; btn.style.background = 'var(--neon-red)';
                        triggerScreenEffects('lose'); gameRunning = false;
                    }
                }, 80);
            } else {
                clearInterval(crashInterval);
                let win = bet * crashMultiplier; balance += win; updateBalanceView();
                btn.innerText = `GAGNÉ +${win.toFixed(2)}$`; btn.style.background = 'var(--neon-green)';
                gameRunning = false;
            }
        }

        /* 📦 MYSTERY BOX LOGIC */
        function buyMysteryBox(bet) {
            let price = parseFloat(document.getElementById('box-type').value);
            if (balance < price) { alert("Solde insuffisant pour cette boîte !"); return; }
            balance -= price; updateBalanceView();
            currentActiveBoxPrice = price;

            const display = document.getElementById('game-display-zone');
            const actionBtn = document.getElementById('main-action-btn');

            actionBtn.disabled = true;
            actionBtn.innerText = "Ouvrez la boîte à l'écran";
            actionBtn.style.background = "#334155";

            display.innerHTML = `
                <div class="box-stage">
                    <div class="interactive-box-wrapper" id="clickable-box" onclick="interactOpenBox()">
                        <div class="box-big-icon" id="box-visual">🎁</div>
                    </div>
                    <div class="box-hint-text" id="box-hint">⚡ CLIQUER SUR LA BOÎTE POUR L'OUVRIR ⚡</div>
                </div>`;
        }
        function interactOpenBox() {
            const box = document.getElementById('clickable-box');
            const visual = document.getElementById('box-visual');
            const hint = document.getElementById('box-hint');
            box.onclick = null;
            hint.innerText = "Ouverture en cours...";
            visual.className = "box-big-icon box-shake-heavy";

            setTimeout(() => {
                visual.className = "box-big-icon box-explode-out";
                setTimeout(() => {
                    let rng = Math.random(); let mult = 0.1; let loot = "Objet Commun";
                    if (rng > 0.95) { mult = 12.0; loot = "👑 ULTRA RARE : COUTEAU KARAMBIT LORE"; }
                    else if (rng > 0.75) { mult = 2.5; loot = "🔮 MYTHIQUE : GANTS SANGUINS CORRODÉS"; }
                    else if (rng > 0.45) { mult = 1.1; loot = "🔫 CLASSIQUE : AK-47 ASSAUT NEON"; }
                    
                    let totalWin = currentActiveBoxPrice * mult;
                    balance += totalWin; updateBalanceView();

                    const stage = document.querySelector('.box-stage');
                    stage.innerHTML = `
                        <div class="reward-card">
                            <div style="font-size:55px; margin-bottom:12px; animation: floatBox 1s ease-in-out infinite;">💎</div>
                            <h4 style="color:var(--text-gold); font-size:16px; margin-bottom:8px; text-transform:uppercase;">${loot}</h4>
                            <p style="font-size:24px; font-weight:800; color:var(--neon-green);">${totalWin.toFixed(2)}$ (${mult}x)</p>
                            <button class="btn-leave" style="margin-top:20px; border-color:var(--neon-green); color:var(--neon-green);" onclick="startGame('cases')">Ouvrir une autre boîte</button>
                        </div>`;
                    
                    const actionBtn = document.getElementById('main-action-btn');
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Placer la mise";
                    actionBtn.style.background = 'var(--neon-green)';
                }, 250);
            }, 1000);
        }

        /* 🎯 INTERACTIVE DARTS LOGIC */
        function runDartsGame(bet) {
            const actionBtn = document.getElementById('main-action-btn');
            
            if (!isDartCharging) {
                // Étape 1 : Retrait mise & Lancement de l'oscillation
                balance -= bet;
                updateBalanceView();
                isDartCharging = true;
                dartPowerValue = 0;
                dartPowerDirection = 1;

                // Nettoyer d'anciennes fléchettes s'il y en a
                document.querySelectorAll('.dart-pin-visual').forEach(p => p.remove());

                actionBtn.innerText = "🔥 TIRER (BLOQUER LA FORCE) !";
                actionBtn.style.background = "var(--neon-red)";
                
                function animateDarts() {
                    if (!isDartCharging) return;
                    dartPowerValue += dartPowerDirection * 4;
                    if (dartPowerValue >= 100) { dartPowerValue = 100; dartPowerDirection = -1; }
                    if (dartPowerValue <= 0) { dartPowerValue = 0; dartPowerDirection = 1; }
                    document.getElementById('dart-power-fill').style.width = dartPowerValue + '%';
                    dartAnimFrame = requestAnimationFrame(animateDarts);
                }
                dartAnimFrame = requestAnimationFrame(animateDarts);

            } else {
                // Étape 2 : Blocage de la force & Calcul du score
                isDartCharging = false;
                cancelAnimationFrame(dartAnimFrame);

                // La cible parfaite est à 75% sur la ligne blanche
                let accuracy = Math.abs(dartPowerValue - 75);
                let multiplier = 0.00;
                let zoneName = "Manqué !";

                if (accuracy <= 3) { multiplier = 10.0; zoneName = "🎯 BULLSEYE SUPRÊME !"; }
                else if (accuracy <= 12) { multiplier = 3.0; zoneName = "🔴 ZONE INTERNE EXTRA"; }
                else if (accuracy <= 25) { multiplier = 1.5; zoneName = "🔵 ZONE EXTERNE"; }

                let wonAmount = bet * multiplier;
                balance += wonAmount;
                updateBalanceView();

                // Animation physique : Positionner l'emoji aiguille sur la cible
                const board = document.getElementById('main-dart-board');
                const pin = document.createElement('div');
                pin.className = 'dart-pin-visual';
                pin.innerText = '📌';

                // Calcul géométrique de l'impact basé sur l'accuracy (0 = centre parfait)
                let radiusOffset = accuracy * 2.4; 
                let randomAngle = Math.random() * Math.PI * 2;
                let posX = 50 + (Math.cos(randomAngle) * radiusOffset / 2.6);
                let posY = 50 + (Math.sin(randomAngle) * radiusOffset / 2.6);

                pin.style.left = posX + '%';
                pin.style.top = posY + '%';
                board.appendChild(pin);

                // Feedback sur le bouton principal
                if (multiplier > 0) {
                    actionBtn.innerText = `${zoneName} (+${wonAmount.toFixed(2)}$)`;
                    actionBtn.style.background = "var(--neon-green)";
                } else {
                    actionBtn.innerText = "Dans le décor ! (0x)";
                    actionBtn.style.background = "var(--text-muted)";
                    triggerScreenEffects('lose');
                }

                setTimeout(() => {
                    if (currentGame === 'darts' && !isDartCharging) {
                        actionBtn.innerText = "Lancer une autre fléchette";
                        actionBtn.style.background = "var(--neon-green)";
                    }
                }, 2000);
            }
        }

        /* 🎡 REAL CIRCULAR ROULETTE LOGIC */
        function buildRouletteWheel(display) {
            display.innerHTML = `
                <div class="roulette-arena">
                    <div class="roulette-wheel-container">
                        <div class="roulette-pointer"></div>
                        <div class="roulette-wheel-disc" id="main-wheel-disc">
                            <div class="wheel-colors-layer"></div>
                        </div>
                        <div class="wheel-center-cap"></div>
                    </div>
                </div>`;
            
            const disc = document.getElementById('main-wheel-disc');
            const pattern = ['red', 'black', 'red', 'black', 'red', 'black', 'gold', 'black', 'red', 'black', 'red', 'black'];
            
            // Placement des libellés textuels physiques au milieu de chaque part de 30°
            for(let i = 0; i < 12; i++) {
                let sliceAngle = (i * 30) + 15;
                let label = pattern[i] === 'gold' ? '⭐' : (pattern[i] === 'red' ? 'R' : 'B');
                let textNode = document.createElement('div');
                textNode.style.position = 'absolute';
                textNode.style.top = '15px';
                textNode.style.left = '50%';
                textNode.style.transform = `translateX(-50%) rotate(${sliceAngle}deg)`;
                textNode.style.transformOrigin = 'center 135px'; // Distance parfaite au centre
                textNode.style.fontWeight = '800';
                textNode.style.fontSize = '14px';
                textNode.style.color = '#fff';
                textNode.style.textShadow = '0 2px 4px #000';
                textNode.innerText = label;
                disc.appendChild(textNode);
            }
        }
        function selectRouletteTarget(color) {
            selectedRouletteColor = color;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active-chip'));
            document.getElementById(`chip-${color}`).classList.add('active-chip');
        }
        function runRouletteWheel(bet) {
            balance -= bet; updateBalanceView();
            const disc = document.getElementById('main-wheel-disc');
            const actionBtn = document.getElementById('main-action-btn');
            actionBtn.disabled = true;

            // Reset l'angle initial à 0 immédiatement sans animation
            disc.style.transition = 'none';
            disc.style.transform = 'rotate(0deg)';
            disc.offsetHeight; // Force reflow

            // Choix de la case gagnante (0 à 11)
            let winIndex = Math.floor(Math.random() * 12);
            const colorsPattern = ['red', 'black', 'red', 'black', 'red', 'black', 'gold', 'black', 'red', 'black', 'red', 'black'];
            let landingColor = colorsPattern[winIndex];

            // Calcul de l'angle pour amener le centre du segment gagnant pile sous le curseur du haut (0°)
            // Segment à l'index i est centré sur (i * 30) + 15 degrés. Pour l'amener à 0° (ou 360°), on fait 360 - angle.
            let targetSliceAngle = 360 - ((winIndex * 30) + 15);
            // Ajout de 5 tours complets (5 * 360 = 1800) pour l'effet d'élan cinétique du croupier
            let finalRotationDegrees = 1800 + targetSliceAngle;

            // Lancement de la rotation physique fluide
            disc.style.transition = 'transform 4s cubic-bezier(0.1, 0.75, 0.1, 1)';
            disc.style.transform = `rotate(${finalRotationDegrees}deg)`;

            setTimeout(() => {
                actionBtn.disabled = false;
                
                // Vérification stricte sans aucun décalage possible
                if (landingColor === selectedRouletteColor) {
                    let mult = landingColor === 'gold' ? 14 : 2;
                    let profit = bet * mult; balance += profit; updateBalanceView();
                    actionBtn.innerText = `🎉 GAGNÉ +${profit.toFixed(2)}$ (${landingColor.toUpperCase()})`;
                    actionBtn.style.background = "var(--neon-green)";
                } else {
                    let textFrench = landingColor === 'red' ? 'Rouge' : (landingColor === 'black' ? 'Noir' : 'Gold');
                    actionBtn.innerText = `PERDU (C'était le ${textFrench})`;
                    actionBtn.style.background = "var(--neon-red)";
                    triggerScreenEffects('lose');
                }
            }, 4100);
        }

        /* LIVE FEED GAINS SIMULÉS */
        const usernames = ["TristanX", "CryptoBro", "KcorpFan", "Zeus99", "LuckyUser", "SaucisseMan", "AlphaGambler"];
        const gamePool = ["Crash", "Mines", "Boîtes", "Fléchettes", "Roulette"];
        const ticker = document.getElementById('live-wins-container');

        function generateLiveWin() {
            const user = usernames[Math.floor(Math.random() * usernames.length)];
            const g = gamePool[Math.floor(Math.random() * gamePool.length)];
            const amt = (Math.random() * 150 + 4).toFixed(2);
            const wBox = document.createElement('div'); wBox.className = 'win-box';
            wBox.innerHTML = `<strong>${user}</strong><span style="color:var(--text-muted);">${g}</span><span style="color:var(--neon-green);">+${amt}$</span>`;
            ticker.insertBefore(wBox, ticker.firstChild);
            if (ticker.children.length > 5) ticker.removeChild(ticker.lastChild);
        }
        setInterval(generateLiveWin, 2200); generateLiveWin(); generateLiveWin();
    </script>
